<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANMC 2026 · Badge Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'Poppins',-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#eef4fb;color:#13233f}
  header{background:linear-gradient(135deg,#1766b3,#2aa0c6);color:#fff;padding:16px 20px}
  header h1{margin:0;font-size:18px;font-weight:700}
  header p{margin:4px 0 0;font-size:12px;opacity:.9}
  .login{max-width:360px;margin:60px auto;background:#fff;border-radius:16px;padding:26px;box-shadow:0 10px 30px rgba(20,60,120,.14)}
  .login h2{margin:0 0 14px;font-size:16px}
  .login input{width:100%;padding:11px 12px;margin:6px 0;border:1px solid #cfe0f0;border-radius:10px;font-size:14px}
  .btn{background:#1766b3;color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer;font-size:14px}
  .btn:disabled{opacity:.6;cursor:default}
  .btn.alt{background:#2a9d55}
  .err{color:#c0392b;font-size:12.5px;min-height:16px;margin-top:4px}
  .bar{display:none;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 20px;background:#fff;border-bottom:1px solid #dce7f3;position:sticky;top:0;z-index:5}
  .bar input{padding:9px 11px;border:1px solid #cfe0f0;border-radius:9px;font-size:13px;background:#fff}
  .status{font-size:13px;color:#456}
  #sheets{display:none;flex-wrap:wrap;gap:16px;padding:20px;justify-content:center}
  .card{position:relative;width:280px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 6px 18px rgba(20,60,120,.12)}
  .card.off{opacity:.4}
  .pick{position:absolute;top:8px;left:8px;z-index:2;background:#fff;border-radius:8px;padding:3px 6px;box-shadow:0 2px 6px rgba(0,0,0,.15);display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:#234}
  .pick input{width:18px;height:18px;cursor:pointer}
  .card canvas{width:100%;display:block}
</style>
</head>
<body>
<header>
  <h1>ANMC 2026 · Badge Generator</h1>
  <p>Role &amp; QR &amp; name on the conference badge &middot; print-ready PDF</p>
</header>

<div class="login" id="loginPane">
  <h2>Sign in</h2>
  <input id="bEmail" type="email" value="SALTameemi@hamad.qa" placeholder="Email">
  <input id="bPass" type="password" placeholder="Password">
  <button class="btn" id="bLogin" style="width:100%;margin-top:8px">Sign in</button>
  <div class="err" id="bErr"></div>
</div>

<div class="bar" id="bar">
  <button class="btn" id="loadDb">Load all</button>
  <input id="findBox" placeholder="Find by ID">
  <button class="btn" id="findBtn">Find</button>
  <span class="lbl" style="font-size:12px;color:#456;font-weight:600">Categories <span style="color:#9ab;font-weight:500">(none ticked = all)</span></span>
  <span id="catBox" style="display:inline-flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:6px 10px;border:1px solid #cfe0f0;border-radius:9px;background:#fff;max-width:620px">
    <span style="font-size:12px;color:#9ab">Load data to list categories</span>
  </span>
  <button class="btn alt" id="catClear" style="padding:7px 10px;font-size:12px">Show all</button>
  <span class="lbl" style="font-size:12px;color:#456;font-weight:600">Attendance</span>
  <select id="modeSel" style="padding:9px 11px;border:1px solid #cfe0f0;border-radius:9px;font-size:13px;background:#fff">
    <option value="inperson" selected>In-person only (badges)</option>
    <option value="all">All (in-person + online)</option>
    <option value="online">Online only</option>
  </select>
  <span class="lbl" style="font-size:12px;color:#456;font-weight:600">Print status</span>
  <select id="prSel" style="padding:9px 11px;border:1px solid #cfe0f0;border-radius:9px;font-size:13px;background:#fff">
    <option value="unprinted" selected>Not printed yet</option>
    <option value="all">All</option>
    <option value="printed">Printed only</option>
  </select>
  <span class="lbl" style="font-size:12px;color:#456;font-weight:600">Registered after</span>
  <input id="afterDate" type="date" style="padding:8px 10px;border:1px solid #cfe0f0;border-radius:9px;font-size:13px;background:#fff">
  <button class="btn" id="clearDate" style="padding:9px 12px">Clear</button>
  <span class="lbl" style="font-size:12px;color:#456;font-weight:600">Sort</span>
  <select id="sortSel" style="padding:9px 11px;border:1px solid #cfe0f0;border-radius:9px;font-size:13px;background:#fff">
    <option value="dbrow" selected>Database order (created_at)</option>
    <option value="surname">Surname (A–Z)</option>
    <option value="name">Full name (A–Z)</option>
    <option value="category">Category</option>
    <option value="id">Registration ID</option>
    <option value="created">Registration date (oldest first)</option>
    <option value="created_desc">Registration date (newest first)</option>
    <option value="none">As loaded</option>
  </select>
  <span class="status" id="status"></span>
  <span style="flex:1"></span>
  <input id="mName" placeholder="Name" style="min-width:120px">
  <input id="mId" placeholder="ID" style="min-width:90px">
  <button class="btn alt" id="addOne">Add</button>
  <button class="btn alt" id="selAll" style="padding:7px 10px;font-size:12px">Select all</button>
  <button class="btn alt" id="selNone" style="padding:7px 10px;font-size:12px">Clear</button>
  <span id="selCount" style="font-size:12px;color:#456;font-weight:700">0 selected</span>
  <label style="font-size:12.5px;color:#456;font-weight:600;display:inline-flex;align-items:center;gap:6px"><input type="checkbox" id="markChk" checked> Mark as printed</label>
  <button class="btn" id="dlPdf">Download selected</button>
</div>

<div id="sheets"></div>

  try{ new QRCode(tmp,{text:String(text),width:600,height:600,correctLevel:QRCode.CorrectLevel.L}); }
  catch(e){ tmp.innerHTML=''; new QRCode(tmp,{text:String(text).slice(0,40),width:600,height:600,correctLevel:QRCode.CorrectLevel.L}); }
  const cv=tmp.querySelector('canvas');
  return cv?cv.toDataURL('image/png'):(tmp.querySelector('img')?tmp.querySelector('img').src:'');
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

async function drawBadge(canvas,p){
  const W=BW*SCALE,H=BH*SCALE;
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext('2d');
  ctx.drawImage(tplImg,0,0,W,H);
  const col=catColor(p.category);

  // role label (uppercase) with flanking lines + end dots
  const label=catLabel(p.category);
  let rs=ROLE.size*SCALE;
  const cx=(BW/2)*SCALE, cy=ROLE.cy*SCALE;
  ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillStyle=col;
  // shrink role if too wide
  const maxRole=(BW-ROLE.margin*2-120)*SCALE;
  do{ ctx.font="800 "+rs+"px 'Poppins',Arial,sans-serif"; if(ctx.measureText(label).width<=maxRole) break; rs-=2; }while(rs>40);
  ctx.fillText(label,cx,cy);
  const w=ctx.measureText(label).width;
  const gap=ROLE.lineGap*SCALE, m=ROLE.margin*SCALE;
  const lx0=m, lx1=cx-w/2-gap, rx0=cx+w/2+gap, rx1=W-m;
  ctx.strokeStyle=col; ctx.lineWidth=5*SCALE; ctx.lineCap='round';
  if(lx1>lx0){ ctx.beginPath(); ctx.moveTo(lx0,cy); ctx.lineTo(lx1,cy); ctx.stroke(); }
  if(rx1>rx0){ ctx.beginPath(); ctx.moveTo(rx0,cy); ctx.lineTo(rx1,cy); ctx.stroke(); }
  ctx.fillStyle=col;
  [[lx0],[lx1],[rx0],[rx1]].forEach(a=>{ ctx.beginPath(); ctx.arc(a[0],cy,7*SCALE,0,7); ctx.fill(); });

  // QR from registrant_id
  const q=await loadImg(qrDataURL(p.id));
  const side=QR.side*SCALE;
  ctx.drawImage(q,QR.cx*SCALE-side/2,QR.cy*SCALE-side/2,side,side);

  // name (fit to one line)
  let ns=NAME.size*SCALE; const nm=(p.name||'').trim();
  ctx.fillStyle="#13233f";
  do{ ctx.font="700 "+ns+"px 'Poppins',Arial,sans-serif"; if(ctx.measureText(nm).width<=NAME.maxW*SCALE) break; ns-=2; }while(ns>26);
  ctx.fillText(nm,(BW/2)*SCALE,NAME.cy*SCALE);
}

function surnameOf(n){ const p=String(n||'').trim().split(/\s+/); return (p.length>1?p[p.length-1]:p[0]||'').toLowerCase(); }
function applySort(){
  const mode=($('sortSel')&&$('sortSel').value)||'dbrow';
  const by={
    dbrow:(a,b)=>((a._ix==null?0:a._ix)-(b._ix==null?0:b._ix)),
    surname:(a,b)=>String(a.last||surnameOf(a.name)).localeCompare(String(b.last||surnameOf(b.name)))||String(a.first||'').localeCompare(String(b.first||'')),
    name:(a,b)=>String(a.first||a.name).localeCompare(String(b.first||b.name))||String(a.last||'').localeCompare(String(b.last||'')),
    category:(a,b)=>String(a.category||'').localeCompare(String(b.category||''))||surnameOf(a.name).localeCompare(surnameOf(b.name)),
    id:(a,b)=>String(a.id).localeCompare(String(b.id),undefined,{numeric:true}),
    created:(a,b)=>String(a.created||'').localeCompare(String(b.created||'')),
    created_desc:(a,b)=>String(b.created||'').localeCompare(String(a.created||''))
  }[mode];
  if(by) people.sort(by);
}
function selCount(){ return people.filter(p=>selected.has(p.id)).length; }
function updSelStatus(){ const n=selCount(); const s=$('selCount'); if(s) s.textContent=n+' / '+people.length+' selected'; }
async function render(){
  const my=++renderSeq;                       // cancel any older render still running
  const host=$('sheets'); host.innerHTML='';
  if(!people.length){ $('status').textContent='No badges'; updSelStatus(); return; }
  applySort();
  const list=people.slice();                  // snapshot this render's list
  for(const p of list){
    if(my!==renderSeq) return;                 // a newer render started -> stop
    const card=document.createElement('div'); card.className='card'+(selected.has(p.id)?'':' off');
    const pick=document.createElement('label'); pick.className='pick';
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=selected.has(p.id);
    cb.onchange=()=>{ if(cb.checked) selected.add(p.id); else selected.delete(p.id); card.classList.toggle('off',!cb.checked); updSelStatus(); };
    pick.appendChild(cb); pick.appendChild(document.createTextNode('Print'));
    const cv=document.createElement('canvas'); await drawBadge(cv,p);
    if(my!==renderSeq) return;                 // aborted while awaiting -> don't append stale card
    card.appendChild(pick); card.appendChild(cv); host.appendChild(card);
  }
  if(my!==renderSeq) return;
  $('status').textContent=people.length+' badge(s)'; updSelStatus();
}

async function ensureFont(){ try{ await document.fonts.load("800 96px 'Poppins'"); await document.fonts.load("700 66px 'Poppins'"); }catch(e){} }

$('bLogin').onclick=async ()=>{
  const email=$('bEmail').value.trim().toLowerCase(), pw=$('bPass').value;
  const err=$('bErr'); err.textContent='';
  if(!email||!pw){ err.textContent='Enter email and password.'; return; }
  $('bLogin').disabled=true; $('bLogin').textContent='Signing in…';
  try{
    const res=await fetch(CONFIG.SUPABASE_URL+'/auth/v1/token?grant_type=password',{
      method:'POST',headers:{apikey:CONFIG.SUPABASE_ANON_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email,password:pw})
    });
    const data=await res.json();
    if(!res.ok) throw new Error(data.error_description||data.msg||'Sign-in failed');
    TOKEN=data.access_token;
    $('loginPane').style.display='none'; $('bar').style.display='flex'; $('sheets').style.display='flex';
    $('status').textContent='Loading template…';
    tplImg=await loadImg(TPL); await ensureFont();
    loadAll();
  }catch(e){ err.textContent=String(e.message).includes('Invalid')?'Invalid email or password':e.message; }
  finally{ $('bLogin').disabled=false; $('bLogin').textContent='Sign in'; }
};
$('bPass').addEventListener('keydown',e=>{if(e.key==='Enter')$('bLogin').click();});

async function loadAll(){
  $('status').textContent='Loading…';
  try{
    const res=await fetch(CONFIG.SUPABASE_URL+'/rest/v1/'+CONFIG.REG_TABLE+'?select=registrant_id,full_name,first_name,last_name,category,created_at,attendance_mode,badge_printed&order=created_at.asc',{
      headers:{apikey:CONFIG.SUPABASE_ANON_KEY,Authorization:'Bearer '+TOKEN}});
    if(!res.ok) throw new Error(res.status+': '+await res.text());
    const rows=await res.json();
    allPeople=rows.map((r,i)=>({name:r.full_name||r.registrant_id,id:r.registrant_id,category:r.category,created:r.created_at,last:r.last_name||'',first:r.first_name||'',mode:(r.attendance_mode||''),printed:(r.badge_printed===true),_ix:i}));
    buildCats();
    applyFilter();
  }catch(e){ console.error(e); $('status').textContent='Error: '+e.message; }
}
$('loadDb').onclick=loadAll;

$('findBtn').onclick=doFind;
$('findBox').addEventListener('keydown',e=>{if(e.key==='Enter')doFind();});
async function doFind(){
  const q=$('findBox').value.trim(); if(!q){alert('Type an ID');return;}
  if(!TOKEN){ $('status').textContent='Sign in first.'; return; }
  $('status').textContent='Searching…';
  try{
    const enc=encodeURIComponent('%'+q+'%');
    const res=await fetch(CONFIG.SUPABASE_URL+'/rest/v1/'+CONFIG.REG_TABLE+'?select=registrant_id,full_name,first_name,last_name,category,created_at,attendance_mode,badge_printed&registrant_id=ilike.'+enc+'&order=registrant_id&limit=50',{
      headers:{apikey:CONFIG.SUPABASE_ANON_KEY,Authorization:'Bearer '+TOKEN}});
    if(!res.ok) throw new Error(res.status+': '+await res.text());
    const rows=await res.json();
    if(!rows.length){ $('status').textContent='No match'; allPeople=[]; people=[]; render(); return; }
    allPeople=rows.map((r,i)=>({name:r.full_name||r.registrant_id,id:r.registrant_id,category:r.category,created:r.created_at,last:r.last_name||'',first:r.first_name||'',mode:(r.attendance_mode||''),printed:(r.badge_printed===true),_ix:i}));
    buildCats();
    applyFilter();
  }catch(e){ console.error(e); $('status').textContent='Error: '+e.message; }
}
function catCounts(){ const m={}; allPeople.forEach(p=>{ const c=String(p.category||'').trim()||'—'; m[c]=(m[c]||0)+1; }); return m; }
function buildCats(){
  const box=$('catBox'); if(!box) return;
  const prev={}; box.querySelectorAll('input[type=checkbox]').forEach(cb=>prev[cb.value]=cb.checked);
  const counts=catCounts();
  const cats=[...new Set(allPeople.map(p=>String(p.category||'').trim()).filter(Boolean))].sort();
  if(!cats.length){ box.innerHTML='<span style="font-size:12px;color:#9ab">No categories</span>'; return; }
  box.innerHTML=cats.map(c=>{
    const checked = (c in prev && prev[c]) ? 'checked' : '';   // default: none ticked (= show all)
    const esc=c.replace(/"/g,'&quot;');
    return '<label style="font-size:12.5px;color:#234;font-weight:600;display:inline-flex;align-items:center;gap:5px;cursor:pointer">'+
           '<input type="checkbox" class="catCb" value="'+esc+'" '+checked+'> '+c+' <span style="color:#9ab;font-weight:500">('+(counts[c]||0)+')</span></label>';
  }).join('');
  box.querySelectorAll('.catCb').forEach(cb=>cb.onchange=applyFilter);
}
function checkedCats(){ return new Set([...document.querySelectorAll('#catBox .catCb:checked')].map(cb=>cb.value)); }
function applyFilter(){
  const after=($('afterDate')&&$('afterDate').value)||'';
  const md=($('modeSel')&&$('modeSel').value)||'inperson';
  const cats=checkedCats();
  let list = cats.size ? allPeople.filter(p=>cats.has(String(p.category||'').trim())) : allPeople.slice();
  if(md==='inperson') list = list.filter(p=>String(p.mode||'').toLowerCase()!=='online');   // in-person + unspecified
  else if(md==='online') list = list.filter(p=>String(p.mode||'').toLowerCase()==='online');
  const pr=($('prSel')&&$('prSel').value)||'unprinted';
  if(pr==='unprinted') list = list.filter(p=>!p.printed);
  else if(pr==='printed') list = list.filter(p=>p.printed);
  if(after){ const t0=new Date(after+'T00:00:00').getTime();
    list = list.filter(p=>{ const d=p.created?new Date(p.created).getTime():NaN; return !isNaN(d) && d>=t0; }); }
  people = list;
  selected = new Set(list.map(p=>p.id));   // default: all shown are selected
  render();
}
$('catClear').onclick=()=>{ document.querySelectorAll('#catBox .catCb').forEach(cb=>cb.checked=false); applyFilter(); };
$('modeSel').onchange=applyFilter;
$('prSel').onchange=applyFilter;
$('afterDate').onchange=applyFilter;
$('clearDate').onclick=()=>{ $('afterDate').value=''; applyFilter(); };

$('addOne').onclick=()=>{
  const n=$('mName').value.trim(), id=$('mId').value.trim();
  if(!n||!id){ alert('Enter name and ID'); return; }
  allPeople.push({name:n,id:id,category:'Member'}); $('mName').value=''; $('mId').value=''; applyFilter();
};
$('sortSel').onchange=()=>render();
$('selAll').onclick=()=>{ people.forEach(p=>selected.add(p.id)); render(); };
$('selNone').onclick=()=>{ selected.clear(); render(); };

$('dlPdf').onclick=async ()=>{
  if(!people.length){ alert('Load first'); return; }
  applySort();
  const batch=people.filter(p=>selected.has(p.id));
  if(!batch.length){ alert('No badges selected. Tick the badges you want, or press "Select all".'); return; }
  $('status').textContent='Building PDF…'; $('dlPdf').disabled=true;
  try{
    const { jsPDF }=window.jspdf;
    const PW=105, PH=148;   // A6
    const pdf=new jsPDF({unit:'mm',format:[PW,PH],orientation:'portrait'});
    const cv=document.createElement('canvas');
    const skipped=[]; let done=0;
    for(let i=0;i<batch.length;i++){
      try{
        await drawBadge(cv,batch[i]);
        const img=cv.toDataURL('image/jpeg',0.92);
        if(done>0) pdf.addPage([PW,PH],'portrait');
        pdf.addImage(img,'JPEG',0,0,PW,PH);
        done++;
      }catch(err){ console.error('skip',batch[i]&&batch[i].id,err); skipped.push((batch[i]&&batch[i].id)||'?'); }
      $('status').textContent='Building PDF… '+(i+1)+'/'+batch.length+(skipped.length?(' · skipped '+skipped.length):'');
      await new Promise(r=>setTimeout(r,0));
    }
    if(!done){ $('status').textContent='No badges built'+(skipped.length?(' · all skipped: '+skipped.join(', ')):''); $('dlPdf').disabled=false; return; }
    pdf.save('ANMC2026_Badges.pdf');
    $('status').textContent=done+' badge(s) · PDF saved'+(skipped.length?(' · skipped '+skipped.length+': '+skipped.join(', ')):'');
    if(skipped.length) alert('Some records could not be printed (bad data) and were skipped:\n'+skipped.join(', '));
    // mark the printed ones in the database (shared across the team)
    if($('markChk') && $('markChk').checked){
      const ids=batch.filter(p=>!skipped.includes(p.id)).map(p=>p.id);
      try{
        const r=await fetch(CONFIG.SUPABASE_URL+'/rest/v1/rpc/mark_printed',{method:'POST',
          headers:{apikey:CONFIG.SUPABASE_ANON_KEY,Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},
          body:JSON.stringify({p_ids:ids})});
        if(r.ok){ const idset=new Set(ids); allPeople.forEach(p=>{ if(idset.has(p.id)) p.printed=true; });
          $('status').textContent=done+' badge(s) · PDF saved · marked as printed'; applyFilter(); }
        else { console.warn('mark_printed failed', await r.text()); }
      }catch(e){ console.warn('mark_printed error', e); }
    }
  }catch(e){ console.error(e); $('status').textContent='PDF error: '+e.message; }
  finally{ $('dlPdf').disabled=false; }
};
</script>
